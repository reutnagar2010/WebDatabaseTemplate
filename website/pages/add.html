<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="add.css" />
    <title>Add Movie</title>
  </head>

  <body>

    <div class="background"></div>
    <a href="index.html" class="back-button">Back</a>

    <div class="wrapper">
      <span class="title">Add Movie</span>
      <div class="row">
        <input id="name-input" class="input-text" type="text" placeholder="Movie name">
      </div>
      <div class="row">
        <input id="image-input" class="input-text" type="text" placeholder="Image URl">
      </div>
      <div class="row">
        <div class="select-container">
          <select id="type-input">
            <option value="-1" disabled selected>Select a type</option>
            <option value="1">Hot Now</option>
            <option value="2">Action</option>
            <option value="3">Comedy</option>
            <option value="4">Fantasy</option>
            <option value="5">Family</option>
            <option value="6">Horror</option>
          </select>
          <span class="select-arrow"></span>
        </div>
      </div>
      <div class="multy-row">
        <div class="box">
          <span class="box-title">Duretion:</span>
          <input id="duration-input" type="number">
        </div>
        <div class="box">
          <span class="box-title">Age:</span>
          <input id="age-input" type="number">
        </div>
        <div class="box">
          <span class="box-title">Year:</span>
          <input id="year-input" type="number">
        </div>
        <div class="box">
          <span class="box-title">Ticket price:</span>
          <input id="price-input" type="number">
        </div>
      </div>
      <div class="row">
        <input id="description-input" class="input-text" type="text" placeholder="Description">
      </div>
      <button id="submit-button">Submit</button>
      <div id="errorDiv"></div>
    </div>


    <script type="module" src="add.js"></script>
  </body>
</html>
