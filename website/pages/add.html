<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="signUp.css" />
    <link rel="stylesheet" href="add.css" />
    <title>Add Movie</title>
  </head>

  <body>
    <div class="box">
    <div id="boxDiv">
      <h1>Add Movie</h1>

      <table>
        <tr>
          <td>Movie name:</td>
          <td><input id="movieNameInput" type="text" placeholder="Movie name" /></td>
        </tr>
        
        <tr>
          <td>Image URL:</td>
          <td><input id="imgUrlInput" type="url" placeholder="Image URL"/></td>
        </tr>

        <tr>
          <td> Duration: <input id="durationInput" type="number" placeholder="Duration" /></td>
          <td> Age: <input id="ageInput" type="number" placeholder="Age" /></td>
          <td>Ticket price: <input id="ticketPriceInput" type="number" placeholder="Ticket price" /></td>
        
        </tr>
    
        <tr>
          <td>Description:</td>
          <td><textarea id="descriptionTextarea" rows="4" type="text"></textarea></td>
        </tr>
      </table>
      <br />
      <button id="submitButton">Submit</button>
      <br />
      <div id="errorDiv"></div>
    </div>
      </div>

    <script type="module" src="add.js"></script>
  </body>
</html>
